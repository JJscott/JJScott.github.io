<template class="ks-tpl-head">
  <div class="ks-row ks-head">
    <span>No.</span>
    <span>Title</span>
    <span>Singer</span>
  </div>
</template>

<template class="ks-tpl-row">
  <div class="ks-row">
    <span class="ks-num" data-field="number"></span>
    <span data-field="title"></span>
    <span data-field="singer"></span>
    <small class="ks-meta">
      <span data-part="lyricist">Lyrics: <span data-field="lyricist"></span></span>
      <span data-part="composer">Music: <span data-field="composer"></span></span>
      <span data-part="extra"><span data-field="extra"></span></span>
    </small>
  </div>
</template>
