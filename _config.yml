# Jekyll configuration

name: JJScott
title: JJScott website
description: A website of some kind!

# urls
url: https://jjscott.nz/
baseurl: ''

## default date_format
date_format: 
  title: "%B-%-d-%Y"
  archive: "%b"
  categories: "%b-%Y"
  tag: "%b-%Y"

# styles
highlighter: rouge
markdown: kramdown

# build exclusions
exclude: ['README.md', 'LICENSE', "*.bak"]

# include non-post pages
include: ['_pages', '_articles', '_tutorial']

collections:
  articles:
    output: true
    permalink: /articles/:path/
  tutorial:
    output: true
    permalink: /tutorial/:path/