# Jekyll configuration

name: JJScott
description: A website of some kind!

# urls
url: https://jjscott.nz/
baseurl: ''

## default date_format
date_format: 
  title: "%B-%-d-%Y"
  archive: "%b"
  categories: "%b-%Y"
  tag: "%b-%Y"

# Language
lan: "en" 

paginate: 10

# styles
highlighter: rouge
markdown: kramdown
gems: ['jekyll-paginate']

# build exclusions
exclude: ['README.md', 'LICENSE', "*.bak"]

# include non-post pages
include: ['_pages']
include: ['_articles']