<!-- Basic list of links from data/links.yml -->
{% assign trans = site.data.values[site.lan] %}
<h1 class="title">Links</h1>
<div class="content">
  <ul>
    {% for link in site.data.links %}
    <li>
      <a href="{{ link.url }}">
        {{ link.title }}
      </a>
    </li> 
    {% endfor %}
  </ul>
</div>
