<!-- Footer for ALL pages -->

{% assign trans = site.data.values[site.lan] %}
<footer class="footer">
  <div class="content has-text-centered">
    <p>&copy;{{ site.time | date: '%Y' }} {{ site.name }}{{ trans.thanks }}
      {% for thank in site.data.thanks %}
        <a href="{{ thank.url }}">
        {{ thank.title }}
        </a>
        <!-- not the last, output a ',' -->
        {% if forloop.last == false %}
        ,
        {% endif %}
      {% endfor %}
    </p>
  </div>
</footer>
